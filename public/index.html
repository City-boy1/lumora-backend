<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Login</h1>

        <form id="loginForm">

            <input type="text" id="name" placeholder="Name" required>

            <input type="password" id="password" placeholder="Password" required>

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

    </div>

    <script src="login.js"></script>

</body>

</html>
